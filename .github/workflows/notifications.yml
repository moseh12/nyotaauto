
name: Nyota Fund Notifications

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without sending'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nyotafund-notifications
  cancel-in-progress: false

jobs:
  send:
    name: Send Nyota Fund Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show trigger information
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Nyota Fund Notifications"
          echo "Trigger: $EVENT_NAME"
          echo "Schedule: Every 5 minutes"
          echo "UTC Time: $(date -u)"

      - name: Run notification bot
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: auto
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.dry_run && '1' || '0') }}
        run: node bot.js

      - name: Save notification state
        if: ${{ !cancelled() && (github.event_name == 'schedule' || !inputs.dry_run) }}
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json
            git commit -m "chore: update notification state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi
