name: Nyota Fund Notifications

on:
  # Every 5 minutes; apps.json decides when a promo is actually sent
  schedule:
    - cron: '*/5 * * * *'

  # Manual run (dry run = preview only, nothing sent)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without sending'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nyotafund-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run notification bot
        env:
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: auto
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node bot.js

      # Runs even if the bot step failed, so successful sends are recorded
      - name: Save notification state
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notification state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi