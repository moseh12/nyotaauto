name: Nyota Fund Notifications

on:
  # Every 15 minutes, off the hour (bot.js cooldown decides when to actually send)
  schedule:
    - cron: '4,19,34,49 * * * *'

  # Manual testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - auto
      dry_run:
        description: 'Preview without sending notifications'
        type: boolean
        default: true
      only_app:
        description: 'Only this app id (blank = all apps)'
        type: string
        default: ''
      force:
        description: 'Ignore quiet hours, daily limit and cooldown'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nyotafund-notifications
  cancel-in-progress: false

jobs:
  send:
    name: Send Nyota Fund Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run notification bot
        env:
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode || 'test' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.dry_run && '1' || '0') }}
          ONLY_APP: ${{ inputs.only_app }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          # Test-mode pushes go here instead of to real users
          TEST_TOPIC: test_devices
        run: node bot.js

      # Runs even if one app failed, so successful sends are recorded
      # (prevents the other apps from resending every run)
      - name: Save notification state
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'auto' && !inputs.dry_run)) }}
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notification state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No notification state changes."
          fi