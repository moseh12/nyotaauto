
name: Nyota Fund Notifications

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'auto or test'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - auto

      dry_run:
        description: 'Preview without sending'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nyotafund-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bot
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

        run: node bot.js

      - name: Save notification state
        if: success() && (github.event_name != 'workflow_dispatch' || (inputs.mode == 'auto' && !inputs.dry_run))
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notification state [skip ci]"
            git push
          fi
